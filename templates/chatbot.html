<!-- Marked.js for Markdown Rendering -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<!-- Floating Chatbot Widget Component -->
<div id="chatbot-container" style="position: fixed; bottom: 30px; right: 30px; z-index: 99999999 !important; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
    <button id="chatbot-toggle-btn" type="button" style="background-color: #0b5345; color: #ffffff; border: none; border-radius: 50%; width: 65px; height: 65px; font-size: 28px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; outline: none;">
        💬
    </button>

    <div id="chatbot-box" style="display: none; position: absolute; bottom: 80px; right: 0; width: 370px; height: 500px; background: #ffffff; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.3); overflow: hidden; flex-direction: column; border: 1px solid #dcdcdc;">
        <!-- Header -->
        <div style="background-color: #0b5345; color: #ffffff; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center;">
            <div>
                <span style="font-weight: bold; font-size: 14px;">Smart Village AI Voice Guide</span>
                <span id="voice-lang-badge" style="font-size: 10px; background: rgba(255,255,255,0.2); padding: 2px 6px; border-radius: 4px; margin-left: 6px;">ta-IN / en-IN</span>
            </div>
            <button id="chatbot-close-btn" type="button" style="background: none; border: none; color: #ffffff; font-size: 24px; cursor: pointer; line-height: 1;">&times;</button>
        </div>

        <!-- Chat Body -->
        <div id="chat-messages" style="flex: 1; padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; font-size: 13px; background: #f8faf8;">
            <div style="align-self: flex-start; background: #e8f5e9; color: #1b5e20; padding: 8px 12px; border-radius: 8px; max-width: 85%; line-height: 1.4;">
                வணக்கம்! Hello! Click the 🎙️ mic button and speak your query, or type below.
            </div>
        </div>

        <!-- Listening indicator -->
        <div id="listening-status" style="display: none; background: #ffebee; color: #c62828; font-size: 11px; text-align: center; padding: 4px; font-weight: bold;">
            🔴 Listening... Speak now (பேசுங்கள்...)
        </div>

        <!-- Input Box with Mic, Input, and Send -->
        <div style="display: flex; border-top: 1px solid #e0e0e0; padding: 8px; background: #ffffff; gap: 6px; align-items: center;">
            <button id="voice-mic-btn" type="button" title="Speak Query" style="background: #e0f2f1; color: #00796b; border: 1px solid #b2dfdb; border-radius: 50%; width: 36px; height: 36px; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center;">
                🎙️
            </button>
            <input type="text" id="chat-input" placeholder="Type or click mic to speak..." style="flex: 1; border: 1px solid #ccc; padding: 8px 10px; border-radius: 6px; outline: none; font-size: 13px;">
            <button id="chat-send-btn" type="button" style="background: #0b5345; color: #ffffff; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px;">
                Send
            </button>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const toggleBtn = document.getElementById('chatbot-toggle-btn');
    const closeBtn = document.getElementById('chatbot-close-btn');
    const chatBox = document.getElementById('chatbot-box');
    const sendBtn = document.getElementById('chat-send-btn');
    const micBtn = document.getElementById('voice-mic-btn');
    const chatInput = document.getElementById('chat-input');
    const chatMessages = document.getElementById('chat-messages');
    const listeningStatus = document.getElementById('listening-status');

    if (!toggleBtn || !chatBox) return;

    // Toggle Chat Window
    toggleBtn.addEventListener('click', () => {
        const isClosed = (chatBox.style.display === 'none' || chatBox.style.display === '');
        chatBox.style.display = isClosed ? 'flex' : 'none';
        if (isClosed) chatInput.focus();
    });

    closeBtn.addEventListener('click', () => {
        chatBox.style.display = 'none';
        window.speechSynthesis.cancel();
    });

    // 1. SPEECH RECOGNITION (Speech-to-Text)
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isListening = false;

    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = false;
        
        // Auto-detect portal language from html lang attribute (ta or en)
        const portalLang = document.documentElement.lang === 'ta' ? 'ta-IN' : 'en-IN';
        recognition.lang = portalLang;

        recognition.onstart = () => {
            isListening = true;
            micBtn.style.background = '#ffcdd2';
            micBtn.style.borderColor = '#e57373';
            listeningStatus.style.display = 'block';
        };

        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            chatInput.value = transcript;
            // Auto-send recognized voice query
            handleSend();
        };

        recognition.onerror = (event) => {
            console.warn('Speech Recognition error:', event.error);
            stopListening();
        };

        recognition.onend = () => {
            stopListening();
        };
    } else {
        micBtn.style.display = 'none'; // Browser does not support Web Speech API
    }

    function stopListening() {
        isListening = false;
        micBtn.style.background = '#e0f2f1';
        micBtn.style.borderColor = '#b2dfdb';
        listeningStatus.style.display = 'none';
    }

    micBtn.addEventListener('click', () => {
        if (!recognition) return;
        if (isListening) {
            recognition.stop();
        } else {
            // Set language dynamically depending on session toggle
            recognition.lang = document.documentElement.lang === 'ta' ? 'ta-IN' : 'en-IN';
            recognition.start();
        }
    });

    // 2. TEXT TO SPEECH (Voice Read-Out)
    function speakText(text) {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel(); // Stop any active audio

        // Strip markdown asterisks and hash symbols for natural voice pronunciation
        const cleanText = text.replace(/[*#_`]/g, '').replace(/\/g, '');
        const utterance = new SpeechSynthesisUtterance(cleanText);
        
        // Detect Tamil text vs English text
        const hasTamil = /[\u0B80-\u0BFF]/.test(cleanText);
        utterance.lang = hasTamil ? 'ta-IN' : 'en-IN';
        utterance.rate = 0.95; // Clear speaking speed
        
        window.speechSynthesis.speak(utterance);
    }

    // 3. MESSAGE DISPATCH & API CALL
    async function handleSend() {
        const msg = chatInput.value.trim();
        if (!msg) return;

        appendMsg(msg, 'user');
        chatInput.value = '';

        const typingIndicator = document.createElement('div');
        typingIndicator.style.cssText = 'align-self: flex-start; background: #e8f5e9; color: #1b5e20; padding: 8px 12px; border-radius: 8px; font-style: italic; font-size: 12px;';
        typingIndicator.textContent = 'Typing / பதில் தயாராகிறது...';
        chatMessages.appendChild(typingIndicator);
        chatMessages.scrollTop = chatMessages.scrollHeight;

        try {
            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: msg })
            });
            const data = await res.json();
            typingIndicator.remove();
            
            const botReply = data.reply || 'No response received from assistant.';
            appendMsg(botReply, 'bot');
            
            // Speak the AI response out loud
            speakText(botReply);
        } catch (err) {
            typingIndicator.remove();
            appendMsg('Unable to connect to server. Please check your network connection.', 'bot');
        }
    }

    function appendMsg(text, sender) {
        const div = document.createElement('div');
        
        if (sender === 'user') {
            div.style.cssText = 'align-self: flex-end; background: #0b5345; color: #ffffff; padding: 8px 12px; border-radius: 8px; max-width: 85%; line-height: 1.4; word-break: break-word;';
            div.textContent = text;
        } else {
            div.style.cssText = 'align-self: flex-start; background: #e8f5e9; color: #1b5e20; padding: 8px 12px; border-radius: 8px; max-width: 85%; line-height: 1.4; word-break: break-word; position: relative;';
            
            // Render parsed markdown
            const contentSpan = document.createElement('div');
            if (typeof marked !== 'undefined') {
                contentSpan.innerHTML = marked.parse(text);
            } else {
                contentSpan.textContent = text;
            }
            div.appendChild(contentSpan);

            // Add small repeat voice button
            const audioBtn = document.createElement('button');
            audioBtn.type = 'button';
            audioBtn.innerHTML = '🔊';
            audioBtn.title = 'Replay Voice';
            audioBtn.style.cssText = 'background: none; border: none; cursor: pointer; font-size: 13px; margin-top: 4px; display: inline-block; padding: 0;';
            audioBtn.onclick = () => speakText(text);
            div.appendChild(audioBtn);
        }

        chatMessages.appendChild(div);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    sendBtn.addEventListener('click', handleSend);
    chatInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleSend();
    });
});
</script>
